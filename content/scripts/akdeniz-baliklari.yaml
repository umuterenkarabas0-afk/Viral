# Akdeniz'e özgü 10 balık — örnek senaryo
# Söz dizimi (say alanlarında):
#   *kelime*        → altyazıda vurgulu (turkuaz)
#   !kelime!        → altyazıda tehlike rengi (kırmızı)
#   {göster|oku}    → altyazıda "göster", seslendirmede "oku" (örn. {600|altı yüz})
id: akdeniz-baliklari
title: "Akdeniz'e Özgü 10 Balık"
format: countdown
language: tr-TR
environment: ocean
theme: { accent: "#FFD60A", accent2: "#2EE6D6", danger: "#FF4D5E" }

hook:
  say: "Akdeniz'de, yiyenlere *halüsinasyon* gördüren bir balık var! Peki hangisi? İşte Akdeniz'e özgü {10|on} balık."
  subject: sarpa
  env: { habitat: meadow, palette: default }
  title: { kicker: "Akdeniz'e özgü", big: "10 balık", at_word: "İşte" }
  cues:
    - { type: dream, at_word: "halüsinasyon", dur: 1.6, amount: 0.9 }

items:
  - id: barbunya
    rank: 10
    name: Barbunya
    latin: Mullus barbatus
    say: "Onuncu sırada barbunya. Çenesindeki iki *bıyıkla* kumu adeta tadarak avını bulur."
    chips: [ { icon: ruler, text: "~20 cm" }, { icon: pin, text: "Kumlu dipler" } ]
    callout: { anchor: barbels, text: "Tat alan bıyıklar", at_word: "bıyıkla", icon: eye }
    env: { habitat: sand, palette: warm }
    camera: { yaw: [0.9, 0.35], pitch: [0.02, 0.1] }
    fish:
      height: 0.12
      width: 0.065
      maxAt: 0.32
      noseTop: 2.8
      noseBottom: 1.2
      belly: -0.05
      peduncle: 0.26
      eye: { u: 0.11, y: 0.55, size: 0.3, iris: "#d9b04a" }
      mouth: { y: -0.45, len: 0.06, depth: 0.3 }
      colors: { back: "#c63c3f", side: "#e8857a", belly: "#f8e6df", split: 0.25, bellyStart: -0.3 }
      patterns:
        - { type: hstripes, color: "#f2c46a", count: 2, width: 0.25, y0: -0.2, y1: 0.25, u0: 0.2, u1: 0.95, alpha: 0.35 }
      material: { roughness: 0.35, metalness: 0.15, clearcoat: 0.8, iridescence: 0.35 }
      fins:
        color: "#f19a8a"
        dorsal:
          - { u0: 0.27, u1: 0.42, height: 1.05, shape: spiny, rake: 22, rays: 7 }
          - { u0: 0.56, u1: 0.72, height: 0.6, shape: triangle, rake: 22, rays: 9 }
        anal: [ { u0: 0.58, u1: 0.74, height: 0.55, shape: triangle, rake: 25 } ]
        pectoral: { u: 0.26, y: -0.15, size: 0.13, spread: 25 }
        pelvic: { u: 0.3, size: 0.09 }
        caudal: { type: forked, span: 1.3, color: "#e98a7a" }
      barbels: { length: 0.09, color: "#f7e2d2", u: 0.03 }
      swim: { amp: 0.05, waves: 0.85, freq: 1.6 }

