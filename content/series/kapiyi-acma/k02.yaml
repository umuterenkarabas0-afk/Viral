# Kapıyı Açma — Bölüm 2: Batırılmış
id: kapiyi-acma-k02
format: story
title: "Batırılmış"
language: tr-TR
target_duration: 70
bpm: 76
series: { id: kapiyi-acma, title: "Kapıyı Açma", episode: 2, total: 6, next_title: "Ölü Hat", style: minimal }
voice: { engine: elevenlabs, name: NNn9dv8zq2kUo7d3JSGG, speaking_rate: 1.0, settings: { stability: 0.38, similarity_boost: 0.8, style: 0.45 } }  # Derya — Türkçe anlatıcı (ElevenLabs kütüphanesi)
theme: { accent: "#FFD23F", accent2: "#7FD1FF", danger: "#FF3B4E" }
world: { boat: "YUSUF REİS" }
cast_ref: series.yaml

scenes:
  - id: hook
    say: "Babamın saati, kaybolduğu gece üçü on yedi geçe durmuştu. Ve o saati bana, onun en yakın arkadaşı getirmişti."
    set: home
    time: night
    porch: true
    shot: { type: push, target: watch, from: { yaw: 0.3, pitch: 0.9, dist: 2.2 }, to: { yaw: 0.2, pitch: 0.75, dist: 1.4 } }
    props: [watch]
    mood: tension
    cover: true
    cover_at: 0.2
    gfx:
      - { type: hook, text: "Babamın saati öldüğü dakikada durmuştu. *O saati başka biri getirdi.*", instant: true, at: 0, dur: 4.0 }

  - id: leave
    say: "Kapıyı açmadım. Selim amca saati eşiğe bırakıp gitti."
    set: home
    time: night
    porch: true
    filter: peephole
    shot: { type: pov, eye: peephole, target: selim.head, tilt: -0.4, fov: [82, 78] }
    actors: { selim: { pose: walk, spot: porchLeave, walk: [0, 0.9] } }
    props: [watch]
    mood: tension
    gfx:
      - { type: peephole, at: 0 }

  - id: prove
    say: "Babamın numarasına yazdım: Babamsan kanıtla. Cevap bir dakika sonra geldi: Altı yaşındaydın, iskeleden düştün. Seni çıkardığımda kulağına ne fısıldadım?"
    set: home
    time: night
    lights: off
    shot: { type: over, target: deniz.hands, from: { yaw: 2.7, pitch: 0.6, dist: 1.4 }, to: { yaw: 2.9, pitch: 0.7, dist: 1.0 } }
    actors: { deniz: { pose: type, spot: table, phone: true } }
    mood: tension
    gfx:
      - { type: chat, contact: "Babam", status: "son görülme: 1 yıl önce", from: me, text: "Babamsan kanıtla.", at_word: "Babamsan" }
      - { type: chat, contact: "Babam", from: them, text: "6 yaşındaydın, iskeleden düştün. Seni çıkardığımda kulağına ne fısıldadım?", at_word: "Altı" }

  - id: memory
    say: "Bunu kimse bilmiyordu. Annem bile. Sonraki mesaj: Deniz seni bana geri verdi."
    set: harbor
    time: dusk
    filter: flashback
    shot: { type: establish, target: yusuf, from: { yaw: 0.5, pitch: 0.15, dist: 2.2 }, to: { yaw: 0.25, pitch: 0.1, dist: 1.5 } }
    actors: { yusuf: { pose: hold, spot: edge, hood: false } }
    mood: calm
    gfx:
      - { type: notify, from: "Babam", text: "Deniz seni bana geri verdi.", when: "03:24", at_word: "Sonraki" }

  - id: kerem
    say: "Sabah liman güvenlik şefi Kerem kapıma geldi. Babanın teknesini bulduk. Battığı yerden kilometrelerce uzakta."
    set: home
    time: day
    door: open
    shot: { type: push, target: kerem.face, from: { yaw: 0.3, pitch: 0.05, dist: 3.2 }, to: { yaw: 0.15, pitch: 0.03, dist: 1.8 } }
    actors: { kerem: { pose: stand, spot: doorOpen } }
    mood: tension
    gfx:
      - { type: label, text: "KEREM · LİMAN GÜVENLİK ŞEFİ", anchor: kerem.head, at_word: "Kerem", dur: 2.6 }

  - id: crowd
    say: "Bütün kasaba iskeledeydi. Gövdede üç delik vardı."
    set: harbor
    time: day
    shot: { type: establish, target: crowd, from: { yaw: -0.6, pitch: 0.3, dist: 2.2 }, to: { yaw: -0.3, pitch: 0.18, dist: 1.6 } }
    actors: { deniz: { pose: look, spot: boatside }, kerem: { pose: stand, spot: boatside2 } }
    props: [boat, holes, crowd]
    mood: tension

  - id: holes
    say: "Kerem eğilip baktı. Bunlar kayaya çarpınca açılmamış. İçeriden delinmiş. Babamın teknesi batmamıştı. Batırılmıştı."
    set: harbor
    time: day
    shot: { type: push, target: holes, from: { yaw: 0.3, pitch: 0.1, dist: 1.6 }, to: { yaw: 0.1, pitch: 0.05, dist: 0.9 } }
    props: [boat, holes, crowd]
    mood: reveal
    cues: [ { type: shake, at_word: "Batırılmıştı", dur: 0.4, amount: 0.5 } ]
    gfx:
      - { type: stamp, text: "BATIRILMIŞ", tone: danger, at_word: "Batırılmıştı", dur: 2.0 }

  - id: phone
    say: "Kaptan köşkünde, dümenin altında babamın telefonunu buldum. Kırık, içi su dolu, bir yıldır kapalı. Ölü bir telefon. Bana mesaj atamazdı."
    set: harbor
    time: day
    shot: { type: closeup, target: brokenphone, from: { yaw: 0.2, pitch: 1.0, dist: 1.6 }, to: { yaw: 0.1, pitch: 0.9, dist: 1.0 } }
    props: [boat, holes, brokenphone]
    mood: tension
    gfx:
      - { type: label, text: "BİR YILDIR KAPALI", anchor: brokenphone, at_word: "Kırık", dur: 2.4 }

  - id: buzz
    say: "Tam o anda cebimdeki telefon titredi. Babamın numarası: Telefonumu buldun. Şimdi bana inanmayacaksın."
    set: harbor
    time: day
    shot: { type: push, target: deniz.face, from: { yaw: 0.4, pitch: 0.05, dist: 2.6 }, to: { yaw: 0.2, pitch: 0.03, dist: 1.5 } }
    actors: { deniz: { pose: phone, spot: boatside, phone: true } }
    props: [boat, holes, crowd]
    mood: reveal
    cues: [ { type: vibrate, at_word: "titredi" } ]
    gfx:
      - { type: notify, from: "Babam", text: "Telefonumu buldun. Şimdi bana inanmayacaksın.", when: "şimdi", at_word: "Babamın" }

  - id: cliff
    say: "Başımı kaldırdım. Kalabalıkta biri, telefonunu sessizce cebine koyuyordu."
    set: harbor
    time: day
    shot: { type: push, target: suspect, from: { yaw: 0.3, pitch: 0.06, dist: 3.0 }, to: { yaw: 0.15, pitch: 0.04, dist: 1.4 } }
    props: [boat, crowd, suspect_phone]
    mood: cliff
    cues: [ { type: heartbeat, at_word: "Kalabalıkta", dur: 2.4 } ]
    gfx:
      - { type: next, kicker: "Devamı yarın", title: "3. Bölüm: Ölü Hat", cta: "Takip et", at: 4.0 }

seo:
  title: "Batan teknenin içinden ölü bir telefon çıktı 📵 | Kapıyı Açma #2"
  description: "Babamın teknesi batmamıştı, batırılmıştı. Ve ölü telefonu bana hâlâ yazıyordu. (Kurgu dizi) Kalabalıktaki kim? 👇"
  hashtags: ["#kapıyıaçma", "#gerilim", "#hikaye", "#minidizi", "#gizem", "#shorts", "#keşfet", "#karadeniz"]
