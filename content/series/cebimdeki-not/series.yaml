# CEBİMDEKİ NOT — 10 bölümlük dikey mini dizi (Reels / TikTok / Shorts)
# Tür: gizem · komedi · biraz romantik   ·   Bölüm süresi ≈ 45 sn
#
# Bölüm dosyaları: ep01.yaml … ep10.yaml (çekim listesi). Ortak tanımlar burada.
#
# Ses: Microsoft Edge TTS, tr-TR-AhmetNeural. Anlatıcı Kerem'in kendisi (birinci tekil).
# Diğer karakterler aynı sesin farklı perde/hız/işlem varyasyonlarıyla konuşur:
#   n        → Kerem (anlatıcı)
#   note     → cepten çıkan notların okunuşu (yakın, fısıltıya yakın, oda yankısı)
#   nuri     → Nuri Amca (yaşlı, yavaş, sıcak)
#   stranger → yabancılar (simitçi, Hüsnü)
#   old      → Selim Amca
#   shout    → bağırma (açık alan yankısı)
#   twist    → yabancı el yazısıyla gelen son not (derin, karanlık)
id: cebimdeki-not
title: "Cebimdeki Not"
episodes: 10
voice:
  engine: edge
  name: tr-TR-AhmetNeural
  styles:
    n:        { rate: "+8%",  pitch: "+0Hz" }
    note:     { rate: "-2%",  pitch: "-4Hz" }
    nuri:     { rate: "-6%",  pitch: "-14Hz" }
    stranger: { rate: "+2%",  pitch: "-8Hz" }
    old:      { rate: "-4%",  pitch: "-11Hz" }
    shout:    { rate: "+4%",  pitch: "+6Hz", volume: "+20%" }
    twist:    { rate: "-14%", pitch: "-20Hz" }
theme:
  accent: "#FFC94A"     # hardal sarısı (not kâğıdı / vurgu)
  accent2: "#7FD4C1"    # Kadıköy deniz yeşili
  danger: "#FF5A4E"
  paper: "#F4E9CF"
  ink: "#1E1A16"

# Karakterler — renderer/story/character.js prosedürel 3D figür parametreleri.
# outfit alanları: top (kazak/gömlek), coat (uzun palto), jacket (kısa ceket), vest, apron,
# skirt, pants, shoes, scarf. Bölümlerde `outfit:` ile değiştirilebilir.
