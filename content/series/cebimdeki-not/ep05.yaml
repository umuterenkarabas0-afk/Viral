# BÖLÜM 5 — Defne
episode: 5
title: "Defne"
hook: "İKİMİZE DE AYNI KİŞİ YAZIYORDU"
cliff: { question: "Kırk nokta ne anlama geliyor?", next: "BÖLÜM 6" }
seo:
  title: "Cebimdeki Not · Bölüm 5 — Defne"
  description: "Onun da cebinden not çıkıyordu. Notları yan yana koyduk ve gece yarısı son vapura bindik… #5/10"

shots:
  - set: cafe
    time: day
    mood: warm
    label: { place: "MODA · ÇAY BAHÇESİ", time: "14:40" }
    extras: 3
    cast:
      - { who: defne, at: [0.62, 0], face: kerem, pose: sit, do: [[0, sit_talk]], hold: tea, look: cam, expr: smile }
      - { who: kerem, outfit: coat, at: [-0.62, 0], face: defne, pose: sit, do: sit, look: defne, expr: curious }
    cam: { shot: medium, on: defne, angle: -35, move: push, amt: 0.2 }
    tag: { who: defne, name: "DEFNE · 26", sub: "Çizer. O da sıkılmış." }
    lines:
      - say: "Adı Defne'ydi. Yirmi altı yaşında, *çizer*. Ve tıpkı benim gibi, hayattan sıkılmış."

  - set: cafe
    time: day
    mood: mystery
    extras: 3
    cast:
      - { who: defne, at: [0.62, 0], face: kerem, pose: sit, do: sit_talk, look: kerem, expr: neutral }
      - { who: kerem, outfit: coat, at: [-0.62, 0], face: defne, pose: sit, do: sit, look: defne, expr: surprised }
    cam: { shot: two, on: kerem, to: defne, move: push, amt: 0.15 }
    lines:
      - say: "Onun notları da bir ceketten çıkıyordu. Aynı gün, *aynı* bit pazarından almıştı."

  - set: insert
    time: day
    mood: mystery
    prop: { type: notes_many, surface: cloth, hand: nuri }
    cam: { shot: insert, move: orbit, amt: 0.25 }
    sfx: [ { type: paper, at: 0.2 }, { type: paper, at: 1.0 }, { type: paper, at: 1.7 } ]
    lines:
      - say: "Bütün notları masaya dizdik. Hepsi aynı *dolma kalemden* çıkmıştı."

  - set: cafe
    time: day
    mood: comedy
    cast:
      - { who: defne, at: [0.62, 0], face: kerem, pose: sit, do: sit_talk, look: kerem, expr: dreamy }
      - { who: kerem, outfit: coat, at: [-0.62, 0], face: defne, pose: sit, do: sit, look: defne, expr: neutral }
    cam: { shot: close, on: defne, angle: -20, move: push, amt: 0.2 }
    bubble: { who: defne, text: "Bu bir AŞK oyunu!", at_word: "teorisi" }
    lines:
      - say: "Defne'nin teorisi: Bu bir *aşk* oyunu."

  - set: cafe
    time: day
    mood: comedy
    cast:
      - { who: defne, at: [0.62, 0], face: kerem, pose: sit, do: sit, look: kerem, expr: annoyed }
      - { who: kerem, outfit: coat, at: [-0.62, 0], face: defne, pose: sit, do: sit_talk, look: defne, expr: suspicious }
