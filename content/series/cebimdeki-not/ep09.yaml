# BÖLÜM 9 — Kalem
episode: 9
title: "Kalem"
hook: "ARTIK NOTLARI BEN YAZIYORUM"
cliff: { question: "Nuri Amca nereye gitti?", next: "SEZON FİNALİ" }
seo:
  title: "Cebimdeki Not · Bölüm 9 — Kalem"
  description: "Kalemi aldım. İlk notumu karşı apartmandaki yalnız İsmet Bey'e yazdım… #9/10"

shots:
  - set: room
    time: night
    mood: quiet
    cast:
      - { who: kerem, outfit: casual, at: [-1.4, 0.6], face: -90, pose: sit, do: [[0, write_stuck]], hold: pen, look: desk, expr: tired }
    props: [ crumpled ]
    cam: { shot: medium, on: kerem, angle: -50, move: push, amt: 0.2 }
    lines:
      - say: "Kalemi aldım. Ama üç gün boyunca *tek kelime* yazamadım."

  - set: room
    time: night
    mood: tension
    cast:
      - { who: kerem, outfit: casual, at: [-1.4, 0.6], face: -90, pose: sit, do: headhands, look: desk, expr: worried }
    props: [ crumpled ]
    cam: { shot: close, on: kerem, angle: -70, move: push, amt: 0.25 }
    sfx: [ { type: crumple, at: 0.3 } ]
    lines:
      - say: "Kime, ne yazacaktım? Ya birinin hayatını *mahvedersem*?"

  - set: room
    time: night
    mood: warm
    cast:
      - { who: defne, walk: [[2.0, 1.6], [0.5, 0.9]], do: walk, hold: tea2, look: kerem, expr: smile }
