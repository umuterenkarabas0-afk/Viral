    props: [ window_ismet ]
    lines:
      - say: "Karşı apartmanda *İsmet Bey* yine tek başına çay içiyordu."

  - set: insert
    time: night
    mood: warm
    prop: { type: pen_write, surface: wood, hand: kerem }
    cam: { shot: insert, move: push, amt: 0.25 }
    sfx: [ { type: pen, at: 1.0, dur: 4.5 } ]
    lines:
      - say: "Ve ilk notumu yazdım:"
      - say: "Yarın saat beşte, Moda sahilindeki boş satranç masasına otur."
        v: note
        write: true

  - set: cafe
    time: evening
    mood: warm
    cut: whip
    label: { place: "MODA SAHİLİ", time: "17:00" }
    cast:
      - { who: ismet, at: [-0.62, 0], face: nermin, pose: sit, do: sit, look: nermin, expr: surprised }
      - { who: nermin, walk: [[2.2, 1.8], [0.62, 0]], do: [[0, walk], ["@geçti", sit]], pose: [[0, stand], ["@geçti", sit]], face: ismet, look: ismet, expr: smile }
    props: [ chess ]
    cam: { shot: two, on: ismet, to: nermin, move: push, amt: 0.15 }
    lines:
      - say: "Ertesi gün İsmet Bey o masaya oturdu. Beş dakika sonra karşısına biri *geçti*."

  - set: cafe
    time: evening
    mood: warm
    cast:
      - { who: ismet, at: [-0.62, 0], face: nermin, pose: sit, do: laugh, look: nermin, expr: laugh }
      - { who: nermin, at: [0.62, 0], face: ismet, pose: sit, do: [[0, sit_talk], ["@güldüler", laugh]], look: ismet, expr: laugh }
