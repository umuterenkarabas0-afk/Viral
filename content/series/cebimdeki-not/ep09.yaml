    props: [ crumpled ]
    cam: { shot: wide, on: defne, angle: -30, move: push, amt: 0.15 }
    sfx: [ { type: door, at: 0 } ]
    lines:
      - say: "Dördüncü gece Defne geldi. Elinde iki *çay* vardı."

  - set: room
    time: night
    mood: warm
    cast:
      - { who: defne, at: [0.5, 0.9], face: kerem, do: talk, hold: tea2, look: kerem, expr: kind }
      - { who: kerem, outfit: casual, at: [-1.4, 0.6], face: 60, pose: sit, do: sit, look: defne, expr: neutral }
    props: [ crumpled ]
    cam: { shot: close, on: defne, angle: 30, move: push, amt: 0.2 }
    bubble: { who: defne, text: "Birine yalnız olmadığını söyle.", at_word: "Birine" }
    lines:
      - say: "Dedi ki: Sadece birine *yalnız olmadığını* söyle."

  - set: street
    time: night
    mood: quiet
    cast:
      - { who: ismet, at: [0.9, -2.55], y: 3.25, face: 0, pose: sit, do: sit, hold: tea, look: cam, expr: sad }
