    lines:
      - say: "Üç saat satranç oynadılar. Üç saat *güldüler*."

  - set: cafe
    time: evening
    mood: warm
    cast:
      - { who: kerem, outfit: coat, at: [-2.9, 1.6], face: 120, pose: sit, do: sit, look: ismet, expr: smile }
      - { who: defne, at: [-2.4, 1.75], face: 120, pose: sit, do: lean, look: ismet, expr: smile }
      - { who: ismet, at: [-0.62, 0], face: nermin, pose: sit, do: laugh, look: nermin, expr: laugh }
      - { who: nermin, at: [0.62, 0], face: ismet, pose: sit, do: sit, look: ismet, expr: laugh }
    props: [ chess, bench_far ]
    cam: { shot: two, on: kerem, to: defne, angle: 0, move: push, amt: 0.2 }
    lines:
      - say: "Defne başını omzuma koydu. Hayatım ilk defa bir tablo değil, bir *hikâyeydi*."

  - set: market
    time: morning
    mood: tension
    cut: whip
    cast:
      - { who: kerem, outfit: coat, walk: [[-3.0, 2.2], [0.1, 0.5]], do: [[0, run], ["@Ama", idle]], look: stall, expr: [[0, excited], ["@Ama", shock]] }
    props: [ empty_stall ]
    cam: { shot: wide, on: kerem, angle: 15, move: push, amt: 0.25 }
    end: true
    lines:
      - say: "Ertesi sabah Nuri Amca'ya koştum. Ama tezgâh... *bomboştu*."
