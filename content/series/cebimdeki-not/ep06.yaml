      - say: "Haritada kırk nokta vardı. Her birinin yanında *iki isim* ve bir yıl."

  - set: insert
    time: night
    mood: reveal
    prop: { type: map, surface: deck, dots: 40, focus: selim }
    cam: { shot: insert, move: push, amt: 0.45 }
