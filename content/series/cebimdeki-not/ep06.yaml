# BÖLÜM 6 — Kırk Nokta
episode: 6
title: "Kırk Nokta"
hook: "KADIKÖY HARİTASINDA 40 GİZLİ NOKTA"
cliff: { question: "Pazar sabahı onları ne bekliyor?", next: "BÖLÜM 7" }
seo:
  title: "Cebimdeki Not · Bölüm 6 — Kırk Nokta"
  description: "Haritadaki 40 nokta, 40 yılda tanıştırılan 40 çiftti. En eskisi 1984… En yenisi ise biz. #6/10"

