name: Viral video üretimi

on:
  schedule:
    - cron: "17 5 * * *"        # her gün 05:17 UTC (08:17 TR)
    - cron: "47 14 * * *"       # her gün 14:47 UTC (17:47 TR) — günde 2 bölüm
  workflow_dispatch:
    inputs:
      count:
        description: "Bu çalıştırmada üretilecek video sayısı"
        default: "1"
      script:
        description: "(İsteğe bağlı) doğrudan üretilecek senaryo yolu, ör. content/series/balikci-kuponu/b01.yaml"
        default: ""

permissions:
  contents: write

concurrency:
  group: viral-queue
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Seslendirme: ElevenLabs (repo secret adı bunlardan biri olabilir)
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVEN_API_KEY || secrets.XI_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VIRAL_USE_GCLOUD: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Sistem paketleri
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bağımlılıklar
        run: |
          pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: TTS önbelleği
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Video üret
        run: |
          if [ -n "${{ github.event.inputs.script }}" ]; then
            python -m viral make "${{ github.event.inputs.script }}" --workers 3
          else
            python -m viral auto --count "${{ github.event.inputs.count || '1' }}" --workers 3
          fi

      - name: Çıktıları yükle (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/cover.jpg
            output/**/captions.srt
            output/**/post.txt
            output/**/post.json
          if-no-files-found: ignore
          retention-days: 30

      - name: GitHub Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in output/*/; do
            id=$(basename "$d")
            mp4="$d$id.mp4"
            [ -f "$mp4" ] || continue
            tag="video-$id-$(date +%Y%m%d-%H%M)"
            gh release create "$tag" "$mp4" "$d/cover.jpg" "$d/captions.srt" "$d/post.txt" \
              --title "$(head -n1 "$d/post.txt")" --notes-file "$d/post.txt" || true
          done

      - name: Kuyruğu ve yeni senaryoları kaydet
        if: always()
        run: |
          git config user.name "viral-bot"
          git config user.email "viral-bot@users.noreply.github.com"
          git add content/topics.yaml content/scripts content/series || true
          git diff --cached --quiet || (git commit -m "Otomatik üretim: kuyruk güncellendi [skip ci]" && git push)
